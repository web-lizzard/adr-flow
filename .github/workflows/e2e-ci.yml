# Run Playwright E2E tests on pull requests: Postgres, migrations, dual webServer.
name: E2E CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
      DATABASE_URL: postgresql://ci:ci@localhost:5432/adrflow_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/adrflow_test
      JWT_SECRET: ci-insecure-jwt-secret-for-e2e-only-32b
      CORS_ORIGINS: http://127.0.0.1:3100
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: adrflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d adrflow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm run e2e
